# Karahisarlıoğlu Yapı Tasarım sitesi (Next.js - port 3000)
# Sunucuda: cp bu dosyayı /etc/nginx/sites-available/karahisar
# ln -s /etc/nginx/sites-available/karahisar /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx

# default_server: IP ile veya eşleşmeyen Host ile girildiğinde bu site açılır
server {
    listen 80 default_server;
    server_name karahisarliogluyapi.com.tr www.karahisarliogluyapi.com.tr;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
